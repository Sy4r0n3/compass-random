<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<meta name="description" content="#コンパスのキャラクターと所持カード4枚をランダム抽選するツール">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png"><title>#コンパス ランダムデッキ抽選</title><style>
:root{color-scheme:dark;--bg:#10131a;--panel:#1b202b;--line:#333d4c;--accent:#7c9cff;--text:#eef2ff;--muted:#aab5c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Noto Sans JP",sans-serif;padding:16px;max-width:850px;margin:auto}h1{font-size:1.35rem}h2{font-size:1.05rem}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}input,textarea,button{font:inherit;color:var(--text);background:#111722;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;margin:5px 0}textarea{min-height:100px}button{background:#263654;cursor:pointer;font-weight:650}button.primary{background:#526fcb}button.secondary{background:#242b38}.flex{display:flex;gap:8px;flex-wrap:wrap}.flex button{flex:1;min-width:120px}.muted{color:var(--muted);font-size:.88rem}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;min-height:95px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}.hero{font-size:1.4rem;text-align:center;font-weight:800;padding:18px}.list{display:flex;flex-wrap:wrap;gap:7px}.tag{background:#252f41;border-radius:99px;padding:6px 10px;font-size:.85rem;display:flex;gap:8px;align-items:center}.tag button{width:auto;margin:0;padding:3px 8px}.warn{color:#ffd08a}label{display:block;margin-top:10px} @media(min-width:600px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body>
<h1>🎲 #コンパス ランダムデッキ抽選器</h1><button id="installBtn" class="secondary" style="display:none">ホーム画面に追加・インストール</button><p class="muted">キャラクターを抽選し、登録した所持カードから重複なしで4枚選びます。データはこのブラウザ内に保存されます。</p>
<div class="panel"><h2>抽選</h2><div class="hero" id="hero">キャラクター未抽選</div><div class="cards" id="deck"><div class="card">カード①</div><div class="card">カード②</div><div class="card">カード③</div><div class="card">カード④</div></div><div class="flex"><button class="primary" id="draw">キャラ＋カードを抽選</button><button class="secondary" id="redraw">カード4枚だけ引き直す</button></div><p id="msg" class="muted"></p></div>
<div class="panel"><h2>所持カード登録</h2><p class="muted">カード名を1行に1枚ずつ入力してください。まとめて追加できます。</p><textarea id="cardInput" placeholder="例：始龍\n全天\nドリーム☆マジカルスクエア"></textarea><button id="addCards">カードを追加</button><div class="flex"><button class="secondary" id="clearCards">カード一覧を全消去</button></div><p id="cardCount" class="muted"></p><div id="cardList" class="list"></div></div>
<div class="panel"><h2>キャラクター登録・管理</h2><p class="muted">いただいたキャラクター一覧を初期登録しています。必要に応じて追加・削除してください。</p><textarea id="heroInput" placeholder="キャラクター名を1行に1人ずつ"></textarea><button id="addHeroes">キャラクターを追加</button><div class="flex"><button class="secondary" id="clearHeroes">キャラクター一覧を全消去</button></div><p id="heroCount" class="muted"></p><div id="heroList" class="list"></div></div>
<div class="panel"><h2>データのバックアップ</h2><div class="flex"><button id="export">JSONを書き出す</button><button class="secondary" id="importBtn">バックアップを読み込む</button></div><input id="file" type="file" accept="application/json" hidden><p class="muted">ブラウザのデータ消去に備え、定期的にバックアップを保存してください。</p></div>
<script>
const initialHeroes=["十文字アタリ","ジャスティス","リリカ","双挽乃保","桜華忠臣","ジャンヌダルク","マルコス'55","ルチアーノ","Voidoll","深川まとい","グスタフ ハイドリヒ","ニコラ テスラ","初音ミク","ヴィオレッタ ノワール","コクリコット ブランシュ","リュウ","春麗","マリア=S=レオンブルク","アダム=ユーリエフ","13 †サーティーン†","かけだし勇者","エミリア","レム","カイ＝キスク","メグメグ","鏡音リン","鏡音レン","イスタカ","ザック＆レイチェル","輝龍院きらら","モノクマ","ヴィーナス ポロロッチョ","アクア","めぐみん","ソーン=ユーリエフ","リヴァイ","デルミン","トマス","猫宮ひなた","岡部倫太郎","零夜","セイバーオルタ","ギルガメッシュ","ルルカ","ピエール77世","佐藤四郎兵衛忠信","アイズ・ヴァレンシュタイン","狐ヶ咲甘色","ノクティス","HM-WA100 ニーズヘッグ","中島敦","芥川龍之介","ゲームバズーカガール","ライザリン・シュタウト","青春アリス","ジョーカー","イグニス=ウィル=ウィスプ","アインズ・ウール・ゴウン","糸廻輪廻","キリト","アスナ","Bugdoll","ステリア・ララ・シルワ","ラム","2B","ラヴィ・シュシュマルシュ","リムル=テンペスト","アル・ダハブ=アルカティア","御坂美琴","アクセラレータ","天空王 ぶれいずどらごん","ベル・クラネル","ロキシー・ミグルディア","某＜なにがし＞","ロックマン.EXE ＆ 光熱斗","クー・シー","デンジ","パワー","アミスター=バランディン","シノン","ターニャ・デグレチャフ","鬼ヶ式うら","コラプス","ボンドルド","みりぽゆ","ゴン=フリークス","キルア=ゾルディック","チーちゃん","上条当麻","ーペルリニエ","シャドウ","ポプ子＆ピピ美","メルーニャ・ランチェルナ","セイバー","アーチャー","ランサー","‡ファースト‡","レゼ","シャルル・リヒター","一姫","エドワード・エルリック","オクトバリ・ニャル・タココ"];
let heroes=JSON.parse(localStorage.getItem('compassHeroes_userlist_v1')||'null')||[...initialHeroes];let cards=JSON.parse(localStorage.getItem('compassCards')||'[]');let currentHero='';
function save(){localStorage.setItem('compassHeroes_userlist_v1',JSON.stringify(heroes));localStorage.setItem('compassCards',JSON.stringify(cards));render()}
function render(){document.getElementById('heroCount').textContent=`登録キャラクター：${heroes.length}人`;document.getElementById('cardCount').textContent=`登録カード：${cards.length}枚（抽選には4枚必要）`;document.getElementById('heroList').innerHTML=heroes.map((x,i)=>`<span class="tag">${esc(x)} <button onclick="delHero(${i})">×</button></span>`).join('');document.getElementById('cardList').innerHTML=cards.map((x,i)=>`<span class="tag">${esc(x)} <button onclick="delCard(${i})">×</button></span>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function delHero(i){heroes.splice(i,1);save()}function delCard(i){cards.splice(i,1);save()}
document.getElementById('addHeroes').onclick=()=>{let a=document.getElementById('heroInput').value.split(/\n/).map(x=>x.trim()).filter(Boolean);heroes=[...new Set([...heroes,...a])];document.getElementById('heroInput').value='';save()};document.getElementById('addCards').onclick=()=>{let a=document.getElementById('cardInput').value.split(/\n/).map(x=>x.trim()).filter(Boolean);cards=[...new Set([...cards,...a])];document.getElementById('cardInput').value='';save()};document.getElementById('clearHeroes').onclick=()=>{if(confirm('キャラクター一覧を全削除しますか？')){heroes=[];currentHero='';save();document.getElementById('hero').textContent='キャラクター未抽選'}};document.getElementById('clearCards').onclick=()=>{if(confirm('所持カード一覧を全削除しますか？')){cards=[];save()}};
function pick4(){if(cards.length<4){document.getElementById('msg').textContent='カードを4枚以上登録してください。';return false}let pool=[...cards];let out=[];for(let i=0;i<4;i++){let j=Math.floor(Math.random()*pool.length);out.push(pool.splice(j,1)[0])}document.getElementById('deck').innerHTML=out.map((x,i)=>`<div class="card"><div><span class="muted">カード ${i+1}</span><br><strong>${esc(x)}</strong></div></div>`).join('');document.getElementById('msg').textContent='抽選完了！';return true}
document.getElementById('draw').onclick=()=>{if(!heroes.length){document.getElementById('msg').textContent='キャラクターを登録してください。';return}currentHero=heroes[Math.floor(Math.random()*heroes.length)];document.getElementById('hero').textContent=currentHero;pick4()};document.getElementById('redraw').onclick=()=>{if(!currentHero){document.getElementById('msg').textContent='先にキャラクターを抽選してください。';return}pick4()};
document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({heroes,cards},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='compass_random_deck_backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.heroes)||!Array.isArray(d.cards))throw Error();heroes=d.heroes;cards=d.cards;save();alert('読み込みました')}catch{alert('バックアップの形式が正しくありません')}};r.readAsText(f)};render();
// PWA: ホーム画面インストール案内
let deferredInstallPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;installBtn.style.display='block'});
installBtn.addEventListener('click',async()=>{if(!deferredInstallPrompt){alert('Chromeのメニューから「アプリをインストール」または「ホーム画面に追加」を選んでください。');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installBtn.style.display='none'});
window.addEventListener('appinstalled',()=>{installBtn.style.display='none'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.log('Service worker registration failed',err)))}
</script></body></html>
